# Catálogo de skills do Loop de Ciclo de Vida PH3A
# ---------------------------------------------------------------------------
# FONTE: .claude/skills/ph3a-loop/catalog.yml (as cópias em plugins/ são geradas — não edite lá).
#
# Este arquivo é o BACKBONE do loop E a FONTE ÚNICA de membership por grupo. É lido por:
#   - a skill /ph3a-loop (orquestrador interativo) — usa todos os campos
#   - init.sh / migrate.sh (bootstrap) — derivam enabledPlugins por modo a partir de `plugin`
#   - scripts/publicar_skills.py — mapeia cada skill ao plugin em que deve ser publicada
#   - scripts/semear.py — seleciona, no modo cópia, quais skills o projeto recebe
#
# Para ADICIONAR uma skill nova: crie-a em .claude/skills/<skill>/SKILL.md, adicione UMA entrada
# abaixo com `skill` + `categoria` + `plugin`, e rode `python3 scripts/publicar_skills.py`.
# Skill sem entrada aqui é acusada como órfã pelo `--check` e não chega a projeto nenhum.
#
# Campos por entrada:
#   skill      (obrigatório) nome da pasta da skill
#   categoria  (obrigatório) organizacao | padroes | qualidade | seguranca | deploy | gemeo | agentes | tooling
#   plugin     (obrigatório) ph3a-quality | ph3a-seguranca | ph3a-core | ph3a-speckit | ph3a-gemeo
#   tipo       installer | scaffold | analyzer
#   fase       organizar | padroes | qualidade | desenvolver | verificar | deploy
#   requires   lista de skills que precisam estar instaladas antes desta
#   ordem      ordem de execução dentro da fase (menor primeiro)
#   descricao  resumo de uma linha (para o menu do orquestrador)
#
# IMPORTANTE: mantenha `skill:` e `categoria:` como as DUAS primeiras linhas de cada entrada
# (parsing posicional legado). `plugin:` vem logo em seguida.
#
# Modos → plugins habilitados (enabledPlugins):
#   empresa    → ph3a-quality + ph3a-seguranca + ph3a-core + ph3a-speckit + ph3a-gemeo
#   completo   → ph3a-quality + ph3a-seguranca + ph3a-core + ph3a-speckit
#   qualidade  → ph3a-quality + ph3a-core
#   seguranca  → ph3a-seguranca + ph3a-core
#   gemeo      → ph3a-gemeo + ph3a-core

