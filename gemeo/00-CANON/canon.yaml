  consumido_mes_usd: null           # (derivado) gravado por `custo.py saldo --write`
  consumido_mes_ref: null           # AAAA-MM a que consumido_mes_usd se refere
  ledger_head: null                 # último event_hash visto — detecta ledger truncado

