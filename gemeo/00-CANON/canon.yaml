  implementado: []                   # 1 linha por módulo/feature funcionando
  em_construcao: []                  # 1 linha por módulo/feature stub ou parcial
  testes_em: null                    # AAAA-MM-DD da última verificação
  testes: {}                         # ex.: { unit: "9/9 passam", build: "ok", e2e: "1/6" }
