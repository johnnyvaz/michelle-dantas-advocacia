# ======================================================================
# CANON — MODELO NUMÉRICO CANÔNICO  (FONTE ÚNICA DA VERDADE)
# ======================================================================
# Substrato computável do Gêmeo Digital deste negócio.
# TODO documento de prosa nas demais pastas (01..12) deve DERIVAR daqui
# e nunca contradizer estes números. O oráculo lê este YAML para simular
# cenários — se um número não está aqui, o oráculo NÃO deve inventá-lo.
#
# Preenchimento guiado: rode a skill `/montar-gemeo`.
#
# Convenções:
#   - null              → dado ainda não preenchido (oráculo: "não tenho esse dado")
#   - # via <fonte> em <AAAA-MM-DD> → anote a origem de cada valor atualizado
#   - (derivado)        → regravado por `scripts/calc.py --all --write` (fórmulas
#                         em metricas.yaml), NUNCA editado à mão
#   - listas []/mapas {} vazios → seção aplicável mas não preenchida
#   - seção não aplicável ao negócio → remova e registre em _meta.secoes_removidas
#   - FAIXA DE INCERTEZA: drivers podem ser {min: X, max: Y, provavel: Z}
#     (distribuição triangular) em vez de um número — habilita respostas
#     probabilísticas P10/P50/P90 via scripts/montecarlo.py.
#     Ex.: churn_receita_mensal_pct: {min: 2.0, max: 5.0, provavel: 3.0}
#
# Contrato de dados: canon.schema.json (validado por scripts/validar_canon.py,
# automaticamente a cada edição via hook).
# ======================================================================

_meta:
  versao: "0.2"
  data_referencia: "2026-11-10"      # AAAA-MM-DD da última atualização
  natureza: real                     # real | ficticio-mvp | misto
  moeda: BRL
  fonte_da_verdade: true
  secoes_removidas: [planos, unit_economics_por_plano, fundraising, cap_table]  # decisão do dono (Johnny) via /montar-gemeo em 2026-11-10: escritório de advocacia não capta, não tem cap table a modelar nem tabela de planos (receita por honorários)
  observacao: null

# ----------------------------------------------------------------------
empresa:
  razao_social: null
  nome_fantasia: "Michelle Dantas Advocacia"   # via app/metadata.js em 2026-11-10
  cnpj: null
  fundacao: null                     # AAAA-MM-DD
  estagio: null                      # ex.: "pre-seed / validação" | "bootstrap rentável"
  sede: null
  site: null
  fundador: "Michelle Dantas"        # via data/team.js ("Advogada e Proprietária") em 2026-11-10
  one_liner: null                    # o negócio em 1 frase: o que faz, para quem, por quê agora

# ----------------------------------------------------------------------
snapshot:
  # Foto da empresa na data de referência
  meses_operacao: null
  clientes_pagantes: null
  clientes_free: null
  clientes_total: null               # (derivado) pagantes + free
  mrr: null                          # R$/mês — via Stripe (atualizar-financeiro) ou controle interno
  arr: null                          # (derivado) mrr × 12
  ticket_medio: null                 # (derivado) mrr ÷ clientes_pagantes
  uso_produto:
    # As 2–4 métricas de uso que melhor medem ESTE produto.
    # Ex.: transacoes_mes, itens_cadastrados, usuarios_ativos_mes, latencia_p95_ms.
    # Cada chave criada aqui deve ganhar um mapeamento em atualizar-produto.
    {}

# ----------------------------------------------------------------------
# Carteira pagante. 'mrr' em R$/mês. health: bom | atencao | risco
clientes: []
  # - id: C001
  #   nome: null
  #   segmento: null
  #   plano: null
  #   mrr: null
  #   cliente_desde: "AAAA-MM"
  #   health: null
  #   obs: null

# ----------------------------------------------------------------------
# Concentração de receita (derivada de clientes[] — NÃO editar à mão)
concentracao:
  top3_ids: []                       # (derivado)
  top3_mrr: null                     # (derivado)
  top3_pct_do_mrr: null              # (derivado) >60%: risco de concentração relevante
  free_convertiveis_estimados: null

# ----------------------------------------------------------------------
crescimento:
  novos_clientes_pagantes_mes: null  # média móvel últimos 3 meses
  novos_free_mes: null
  conversao_free_para_pago_pct: null
  ciclo_vendas_dias: null
  churn_logo_mensal_pct: null        # cancelamentos de contas/mês
  churn_receita_mensal_pct: null     # perda de MRR/mês
  lifetime_meses_estimado: null      # (derivado) 1 ÷ churn_receita

# ----------------------------------------------------------------------
financeiro:
  caixa_atual: null                  # controle interno — NUNCA vem de MCP
  burn_bruto_mensal: null            # (derivado) soma de custos.*
  receita_mensal: null               # = mrr (+ receitas não recorrentes, se houver)
  burn_liquido_mensal: null          # (derivado) burn_bruto − receita
  runway_meses: null                 # (derivado) caixa ÷ burn_liquido
  margem_bruta_pct: null
  custo_servico_por_cliente_mes: null
  custos:
    folha: null                      # deve fechar com a soma de time[].custo
    infra: null
    apis_terceiros: null
    marketing: null
    ferramentas_saas: null
    contabil_juridico: null
    outros: null

# ----------------------------------------------------------------------
